[build-system]
requires = ["setuptools", "wheel"]
build = "setuptools.build_meta"

[project]
name = "pvplotter"
version = "0.1.0"
description = "Wrappers of PyVista for plotting stuff from JIVE simulations"
requires-python = ">=3.14"
dependencies = [
    "numpy==2.5.3",
    "gmsh==4.15.2",
    "pyvista==0.49.0",
    "pyvistaqt==0.13.1",
    "pyside6==6.11.2"
]
authors = [
    {name = "Luiz A. T. Mororo"}
]

[tool.setuptools]
packages = ["pvplotter"]
